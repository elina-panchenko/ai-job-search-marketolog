<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1240" role="img" aria-label="Элина · Маркетинг по полочкам — логотип">
  <title>Элина · Маркетинг по полочкам</title>
  <desc>Концепция «Полочки»: три горизонтальные полки с разложенными геометрическими фигурами — треугольник, круг, квадрат.</desc>

  <!-- Фон (убери этот прямоугольник для прозрачного фона) -->
  <rect width="1240" height="1240" fill="#ECEAEB"/>

  <!-- Фигуры на полках -->
  <!-- Треугольник на верхней полке -->
  <polygon points="897,285 965,410 829,410" fill="#8C2E9A"/>
  <!-- Круг на средней полке -->
  <circle cx="620" cy="590" r="57" fill="#141414"/>
  <!-- Квадрат на нижней полке -->
  <rect x="290" y="760" width="122" height="122" fill="#5F7E6F"/>

  <!-- Полки -->
  <g fill="none" stroke="#241C24" stroke-width="30" stroke-linecap="round">
    <line x1="278" y1="435" x2="978" y2="435"/>
    <line x1="278" y1="662" x2="978" y2="662"/>
    <line x1="278" y1="915" x2="978" y2="915"/>
  </g>
</svg>
